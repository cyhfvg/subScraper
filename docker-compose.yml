# Runtime only. Does not build or pull.
# Online:  docker build -t subscraper:latest . && docker compose --env-file .env up -d
# Offline: docker load, then the same up command. Never use --build.

services:
  subscraper:
    image: ${IMAGE_NAME:-subscraper:latest}
    pull_policy: never
    container_name: ${CONTAINER_NAME:-subscraper}
    ports:
      - "${SUBSCRAPER_PORT:-8342}:8342"
    volumes:
      - ${RECON_DATA_DIR:-./recon_data}:/app/recon_data
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      SUBSCRAPER_ADMIN_USER: ${SUBSCRAPER_ADMIN_USER:-admin}
      SUBSCRAPER_ADMIN_PASSWORD: ${SUBSCRAPER_ADMIN_PASSWORD:?set SUBSCRAPER_ADMIN_PASSWORD in .env}
      SUBSCRAPER_SKIP_AUTO_INSTALL: ${SUBSCRAPER_SKIP_AUTO_INSTALL:-1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8342/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
